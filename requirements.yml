---
# Install with: ansible-galaxy collection install -r requirements.yml
collections:
  # 6.0+ required: ec2_eip moved into amazon.aws in that release, and the
  # ec2_security_group / ec2_instance parameter names used in site.yml
  # settled there.
  - name: amazon.aws
    version: ">=6.0.0"
  # Needed only for the network load balancer in nlb mode: elb_network_lb,
  # elb_target_group, and elb_target still live here rather than in amazon.aws.
  # If a future amazon.aws release absorbs them, drop this and change the
  # collection prefix on those three tasks in site.yml and teardown.yml.
  - name: community.aws
    version: ">=6.0.0"
  - name: community.crypto
    version: ">=2.0.0"
  - name: ansible.posix
    version: ">=1.5.0"
