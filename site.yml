---
# ===========================================================================
# Build a multi-worker StrongDM proxy cluster natively (binary + systemd) on EC2
# ===========================================================================
#
#   ansible-playbook site.yml
#
# Play 1  control node: resolve the cluster address and credentials, then
#         provision the load balancer and one EC2 instance per entry in
#         workers.yml.
# Play 2  every worker in parallel: install and start the sdm worker service.
# Play 3  control node: register the workers with the load balancer, wait for
#         them to report healthy, and print what is left to do.
#
# Runs are ADD-ONLY. Add a worker to workers.yml, re-run, and the new instance
# joins the existing cluster with the stored key pair and is registered as a
# new target. Nothing already built is touched. Removing an entry destroys
# nothing — that is teardown.yml's job.
#
# Terminology note: a "proxy worker" is a member of a StrongDM *proxy cluster*
# (systemd unit sdm-worker, authenticates with an access key + secret key).
# It is NOT the older gateway/relay node model (unit sdm-proxy, JWT token).
# Both ship in the same sdm binary but take different install flags.
#
# Docs: https://docs.strongdm.com/admin/networking/proxy-clusters
# ===========================================================================

- name: Resolve the cluster and provision the worker fleet
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - workers.yml
    - vault.yml

  tasks:

    # =====================================================================
    # Preflight
    # =====================================================================

    - name: Assert that the StrongDM admin token is set
      ansible.builtin.assert:
        that:
          - sdm_admin_token is defined
          - sdm_admin_token | length > 0
          - sdm_admin_token != "REPLACE_ME"
        fail_msg: >-
          sdm_admin_token is not set. Copy vault.yml.example to vault.yml, add
          an admin token from the StrongDM Admin UI (Settings > Admin Tokens),
          then encrypt it with `ansible-vault encrypt vault.yml`.
        quiet: true

    - name: Assert that workers.yml describes a usable cluster
      ansible.builtin.assert:
        that:
          - sdm_cluster_name | default('') | length > 0
          - sdm_cluster_endpoint | default('') in ['nlb', 'manual']
          - sdm_workers | default([]) | length > 0
          - sdm_workers | map(attribute='name') | list | length ==
            sdm_workers | map(attribute='name') | unique | list | length
        fail_msg: >-
          workers.yml is incomplete. It needs sdm_cluster_name,
          sdm_cluster_endpoint set to either "nlb" or "manual", and at least
          one entry in sdm_workers with a unique name.
        quiet: true

    # Only enforced in manual mode. In nlb mode the address comes from AWS, so
    # there is nothing for the operator to get wrong.
    - name: Assert that a cluster hostname is set in manual mode
      ansible.builtin.assert:
        that:
          - sdm_cluster_hostname | default('') | length > 0
          - sdm_cluster_hostname != "sdm-cluster.example.com"
        fail_msg: >-
          sdm_cluster_endpoint is "manual", so sdm_cluster_hostname must name
          the load balancer clients will resolve. The address is baked into the
          cluster permanently and cannot be changed later, which is why the
          placeholder is rejected rather than defaulted.

          StrongDM requires a load balancer for any cluster with more than one
          worker. If you do not have one, set sdm_cluster_endpoint: nlb and the
          playbook will build one.
        quiet: true
      when: sdm_cluster_endpoint == 'manual'

    - name: Warn if a multi-worker cluster is being built without a load balancer
      ansible.builtin.debug:
        msg: >-
          {{ sdm_workers | length }} workers with sdm_cluster_endpoint=manual —
          make sure sdm_cluster_hostname points at a load balancer, not at a
          worker. StrongDM does not support DNS round-robin across workers: a
          node draining for a rolling upgrade stays in DNS rotation and clients
          land on it anyway.
      when:
        - sdm_cluster_endpoint == 'manual'
        - sdm_workers | length > 1

    # --version is a global flag on the sdm binary, not a subcommand.
    # `sdm version` exits 3 with "No help topic for 'version'".
    - name: Assert that the sdm CLI is present on the control node
      ansible.builtin.command: sdm --version
      register: sdm_version
      changed_when: false
      failed_when: sdm_version.rc != 0

    - name: Show the sdm CLI version in use
      ansible.builtin.debug:
        msg: "Control node sdm CLI: {{ sdm_version.stdout | trim }}"

    # =====================================================================
    # Existing cluster credentials
    # =====================================================================
    # Checked before anything is created, because a cluster whose key pair
    # cannot be obtained is a cluster no worker can join. Creating the pair
    # has to wait until the cluster's address is known (below); finding an
    # existing one does not.
    #
    # Everything about this section exists because of one StrongDM constraint:
    # a cluster's key pair is displayed exactly once, at creation, and there is
    # no CLI command to read it back or mint a replacement.

    - name: Look for stored credentials for this cluster
      ansible.builtin.stat:
        path: "{{ sdm_credentials_file }}"
      register: stored_creds

    # include_vars decrypts vault-encrypted files transparently, so the stored
    # file needs no special handling here. `name:` keeps its keys in their own
    # namespace instead of colliding with anything already defined.
    - name: Load the stored credentials
      ansible.builtin.include_vars:
        file: "{{ sdm_credentials_file }}"
        name: stored_cluster
      when: stored_creds.stat.exists
      no_log: true

    - name: Settle on the credentials to use, if we already have them
      ansible.builtin.set_fact:
        cluster_access_key: >-
          {{ sdm_proxy_cluster_access_key
             if sdm_proxy_cluster_access_key | default('') | length > 0
             else stored_cluster.sdm_cluster_access_key | default('') }}
        cluster_secret_key: >-
          {{ sdm_proxy_cluster_secret_key
             if sdm_proxy_cluster_secret_key | default('') | length > 0
             else stored_cluster.sdm_cluster_secret_key | default('') }}
        credentials_already_stored: "{{ stored_creds.stat.exists }}"
      no_log: true

    - name: Report where the cluster credentials came from
      ansible.builtin.debug:
        msg: >-
          {% if sdm_proxy_cluster_access_key | default('') | length > 0 -%}
          Using the key pair supplied in vault.yml (bring your own cluster).
          {%- elif credentials_already_stored | bool -%}
          Reusing the stored key pair from
          credentials/{{ sdm_cluster_name }}.yml — no cluster will be created.
          {%- else -%}
          No stored key pair for "{{ sdm_cluster_name }}" — this run will
          create the cluster and store its credentials.
          {%- endif %}

    # =====================================================================
    # Network
    # =====================================================================
    # Resolve the candidate subnets and take the VPC id from whichever we land
    # on.
    #
    # Deliberately NOT using ec2_vpc_net_info: that module calls
    # DescribeVpcAttribute to report DNS settings we never read, which needs an
    # extra IAM permission for no benefit. DescribeSubnets alone tells us the
    # subnets, their VPC, and their CIDRs.
    #
    # Filter precedence:
    #   subnet_id set  -> that subnet only, every worker lands in it
    #   vpc_id set     -> all available subnets in that VPC
    #   neither set    -> all default-for-AZ subnets (the default VPC)

    - name: Resolve the candidate subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters: "{{ _subnet_filters }}"
      vars:
        _subnet_filters: >-
          {{ {'state': 'available'}
             | combine({'subnet-id': subnet_id} if subnet_id | length > 0 else {})
             | combine({'vpc-id': vpc_id} if vpc_id | length > 0 else {})
             | combine({'default-for-az': 'true'}
                       if (subnet_id | length == 0 and vpc_id | length == 0) else {}) }}
      register: vpc_subnets

    - name: Assert that usable subnets were found
      ansible.builtin.assert:
        that:
          - vpc_subnets.subnets | length > 0
        fail_msg: >-
          No available subnet found in {{ aws_region }}. If this account has no
          default VPC, set vpc_id (and optionally subnet_id) in
          group_vars/all.yml.
        quiet: true

    # Sorted by AZ so the round-robin below is deterministic: worker 01 always
    # lands in the same subnet across runs, which keeps re-runs idempotent.
    - name: Set the target network
      ansible.builtin.set_fact:
        target_subnet_ids: "{{ _sorted | map(attribute='subnet_id') | list }}"
        target_subnet_azs: "{{ _sorted | map(attribute='availability_zone') | list }}"
        target_subnet_cidrs: "{{ _sorted | map(attribute='cidr_block') | list }}"
        target_vpc_id: "{{ (_sorted | first).vpc_id }}"
      vars:
        _sorted: "{{ vpc_subnets.subnets | sort(attribute='availability_zone') }}"

    - name: Report the resolved network
      ansible.builtin.debug:
        msg: >-
          VPC {{ target_vpc_id }} in {{ aws_region }},
          {{ target_subnet_ids | length }} subnet(s) across
          {{ target_subnet_azs | join(', ') }}

    # An AWS requirement, not a StrongDM one: an NLB must be given subnets in
    # at least two availability zones. Caught here rather than 200 lines later
    # inside a boto3 exception.
    - name: Assert that the network can host a load balancer
      ansible.builtin.assert:
        that:
          - target_subnet_azs | unique | length >= 2
        fail_msg: >-
          sdm_cluster_endpoint is "nlb", but only
          {{ target_subnet_azs | unique | length }} availability zone(s) were
          resolved ({{ target_subnet_azs | join(', ') }}). An AWS network load
          balancer requires subnets in at least two. Clear the global
          subnet_id override in group_vars/all.yml, or set vpc_id to a VPC with
          subnets in two or more zones.
        quiet: true
      when: sdm_cluster_endpoint == 'nlb'

    # Defaults are applied here rather than inline at every reference, so the
    # rest of the play works from one uniform list. The subnet round-robin is
    # what spreads a multi-worker cluster across availability zones — the whole
    # reason to run more than one worker.
    - name: Apply defaults to each worker definition
      ansible.builtin.set_fact:
        workers_resolved: "{{ workers_resolved | default([]) + [_resolved] }}"
      vars:
        _idx: "{{ workers_resolved | default([]) | length }}"
        _resolved:
          name: "{{ item.name }}"
          instance_type: "{{ item.instance_type | default(instance_type) }}"
          root_volume_gb: "{{ item.root_volume_gb | default(root_volume_gb) }}"
          subnet_id: >-
            {{ item.subnet_id
               | default(target_subnet_ids[(_idx | int) % (target_subnet_ids | length)]) }}
      loop: "{{ sdm_workers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Report the planned fleet
      ansible.builtin.debug:
        msg: >-
          {{ item.name }}: {{ item.instance_type }},
          {{ item.root_volume_gb }} GB, subnet {{ item.subnet_id }}
      loop: "{{ workers_resolved }}"
      loop_control:
        label: "{{ item.name }}"

    # =====================================================================
    # Shared infrastructure
    # =====================================================================

    # -- SSH key -----------------------------------------------------------
    # Generated locally rather than downloaded from AWS, so the private key
    # never transits the API and re-runs are idempotent.

    - name: Generate an SSH keypair for the fleet
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path | expanduser }}"
        type: ed25519
        comment: "strongdm-ansible-{{ sdm_cluster_name }}"
        mode: "0600"
      register: demo_ssh_key

    - name: Register the public key with EC2
      amazon.aws.ec2_key:
        region: "{{ aws_region }}"
        name: "{{ ssh_key_name }}"
        key_material: "{{ demo_ssh_key.public_key }}"
        tags: "{{ resource_tags }}"
        state: present

    # -- Security group ----------------------------------------------------
    # One group for the whole cluster. Every worker has identical ingress
    # requirements, so a shared group means adding a worker needs no firewall
    # change at all.
    #
    # Three ingress rules:
    #   worker port from client CIDRs  -> client traffic. Note that an NLB with
    #                                     instance targets preserves the client
    #                                     source IP, so the original client
    #                                     address is what arrives here — not the
    #                                     load balancer's.
    #   liveness    from subnet CIDRs  -> health checks, which DO originate from
    #                                     the load balancer's own addresses in
    #                                     these subnets. Never open this to the
    #                                     internet; it is an unauthenticated
    #                                     status endpoint.
    #   22          from control node  -> Ansible itself
    #
    # Egress is left as AWS creates it (allow all), which covers
    # app.strongdm.com, downloads.strongdm.com, and the proxied resources.

    - name: Create the proxy cluster security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "{{ worker_sg_name }}"
        description: "StrongDM proxy cluster {{ sdm_cluster_name }} - client, health check, and Ansible SSH"
        vpc_id: "{{ target_vpc_id }}"
        tags: "{{ resource_tags }}"
        rules:
          - proto: tcp
            ports:
              - "{{ sdm_worker_bind_port }}"
            cidr_ip: "{{ client_ingress_cidrs }}"
            rule_desc: "StrongDM client traffic to the proxy workers"
          - proto: tcp
            ports:
              - "{{ sdm_liveness_port }}"
            cidr_ip: "{{ target_subnet_cidrs }}"
            rule_desc: "Load balancer liveness health checks"
          - proto: tcp
            ports:
              - 22
            cidr_ip: >-
              {{ ssh_ingress_cidrs if ssh_ingress_cidrs | length > 0
                 else [ansible_default_ipv4.address ~ '/32'] }}
            rule_desc: "SSH from the Ansible control node"
        # No rule_desc on the egress rule, and no purge.
        #
        # AWS creates an allow-all egress rule automatically with every new
        # security group. Supplying a description here makes the module call
        # UpdateSecurityGroupRuleDescriptionsEgress against that pre-existing
        # -1/all-protocol rule, which AWS rejects with "Failed to update
        # security group rule descriptions egress". It reads like a permissions
        # error and is not one.
        purge_rules_egress: false
        state: present
      register: worker_sg

    # -- Load balancer -----------------------------------------------------
    # StrongDM requires a load balancer for any cluster with more than one
    # worker, and the cluster's address is the load balancer's address. So this
    # has to exist before the cluster is created.
    #
    # The target group is created first and referenced by name from the
    # listener, which avoids a chicken-and-egg on ARNs.

    - name: Create the load balancer target group
      community.aws.elb_target_group:
        region: "{{ aws_region }}"
        name: "{{ nlb_target_group_name }}"
        vpc_id: "{{ target_vpc_id }}"
        protocol: TCP
        port: "{{ sdm_worker_bind_port }}"
        target_type: instance
        # StrongDM's recommendation. Without it the workers see the load
        # balancer's address as the client's, and per-client audit data and any
        # source-IP policy on the proxied resources become useless.
        preserve_client_ip_enabled: true
        # The liveness probe, not the traffic port. A worker draining for a
        # rolling upgrade keeps serving 8443 but shuts this port down — that is
        # precisely how it asks to be taken out of rotation.
        health_check_protocol: "{{ nlb_health_check_protocol }}"
        health_check_port: "{{ sdm_liveness_port }}"
        health_check_path: "{{ sdm_liveness_path }}"
        successful_response_codes: "{{ nlb_health_check_codes }}"
        health_check_interval: "{{ nlb_health_check_interval }}"
        healthy_threshold_count: "{{ nlb_healthy_threshold }}"
        unhealthy_threshold_count: "{{ nlb_unhealthy_threshold }}"
        # Targets are registered in play 3, once the workers are actually
        # installed. Left true, this module would treat an empty target list as
        # the desired state and deregister the running fleet on every re-run.
        modify_targets: false
        tags: "{{ resource_tags }}"
        state: present
      register: worker_target_group
      when: sdm_cluster_endpoint == 'nlb'

    - name: Create the network load balancer
      community.aws.elb_network_lb:
        region: "{{ aws_region }}"
        name: "{{ nlb_name }}"
        subnets: "{{ target_subnet_ids }}"
        scheme: internet-facing
        cross_zone_load_balancing: "{{ nlb_cross_zone }}"
        # TCP, not TLS. StrongDM proxy workers terminate mutual TLS themselves
        # and validate client certificates directly; a TLS listener here would
        # break the handshake it is trying to help with. An ALB cannot do this
        # at all, which is why the docs say network load balancer specifically.
        listeners:
          - Protocol: TCP
            Port: "{{ sdm_cluster_port }}"
            DefaultActions:
              - Type: forward
                TargetGroupName: "{{ nlb_target_group_name }}"
        tags: "{{ resource_tags }}"
        state: present
        wait: true
        wait_timeout: 600
      register: worker_nlb
      when: sdm_cluster_endpoint == 'nlb'

    # The address is fixed at cluster creation and cannot be changed. In nlb
    # mode AWS supplies it; note that it embeds a generated hash, so deleting
    # and recreating the load balancer yields a DIFFERENT address and orphans
    # the cluster. See README "Rebuilding in nlb mode".
    - name: Determine the cluster's advertised address
      ansible.builtin.set_fact:
        cluster_address: >-
          {{ (worker_nlb.dns_name if sdm_cluster_endpoint == 'nlb'
              else sdm_cluster_hostname) ~ ':' ~ sdm_cluster_port }}

    - name: Report the cluster address
      ansible.builtin.debug:
        msg: >-
          Cluster address: {{ cluster_address }}
          ({{ 'AWS-provided NLB hostname' if sdm_cluster_endpoint == 'nlb'
              else 'your load balancer, DNS managed by you' }})

    # =====================================================================
    # Create the cluster, if this is the first run
    # =====================================================================

    # Runs unconditionally, including when credentials were already found.
    #
    # It is tempting to skip this when a key pair is already in hand — there is
    # nothing to create, so why ask? Because holding a key pair is not evidence
    # that the cluster still exists. Deleting a cluster does not delete the
    # credentials file, so a teardown followed by a re-run would sail past
    # creation on the strength of a stale file and hand every worker keys for a
    # cluster that is gone. The workers install fine and then fail to
    # authenticate, which surfaces two plays later as a bind timeout on 8443 and
    # looks nothing like the actual cause.
    - name: Check whether the proxy cluster exists in StrongDM
      ansible.builtin.command:
        cmd: sdm admin nodes list --json --filter "name:{{ sdm_cluster_name }}"
      environment:
        SDM_ADMIN_TOKEN: "{{ sdm_admin_token }}"
        SDM_APP_DOMAIN: "{{ sdm_app_domain }}"
      register: existing_cluster
      changed_when: false
      failed_when: false
      no_log: true

    - name: Record whether that cluster is already present
      ansible.builtin.set_fact:
        cluster_exists: >-
          {{ sdm_cluster_name in (existing_cluster.stdout | default('')) }}

    - name: Fail if the stored credentials belong to a cluster that no longer exists
      ansible.builtin.fail:
        msg: |
          Stale credentials.

          credentials/{{ sdm_cluster_name }}.yml holds a key pair, but no
          cluster named "{{ sdm_cluster_name }}" exists in StrongDM. Almost
          always this means teardown.yml deleted the cluster and the credentials
          file outlived it.

          Continuing would install workers with keys nothing will accept. They
          would come up, fail to authenticate, and never bind
          port {{ sdm_worker_bind_port }} — a failure that looks like a
          networking problem and is not one.

          Delete the stale file and re-run; the cluster will be recreated and
          fresh credentials stored:

            rm credentials/{{ sdm_cluster_name }}.yml
            ansible-playbook site.yml

          Existing workers do not need rebuilding — the re-run rewrites their
          environment file with the new key pair and restarts them.
      when:
        - credentials_already_stored | bool
        - not cluster_exists | bool
        - sdm_proxy_cluster_access_key | default('') | length == 0

    # Without this guard a second run with a missing credentials file would
    # create a duplicate cluster in StrongDM. The worker install is idempotent;
    # cluster creation is not.
    - name: Create the proxy cluster
      ansible.builtin.command:
        cmd: >-
          sdm admin nodes create-proxy-cluster
          --name {{ sdm_cluster_name }}
          --tags Project=strongdm-ansible-demo,Cluster={{ sdm_cluster_name }},ManagedBy=ansible
          {{ cluster_address }}
      environment:
        SDM_ADMIN_TOKEN: "{{ sdm_admin_token }}"
        SDM_APP_DOMAIN: "{{ sdm_app_domain }}"
      register: cluster_create
      changed_when: cluster_create.rc == 0
      no_log: true
      when:
        - cluster_access_key | length == 0
        - not cluster_exists | bool

    # `create-proxy-cluster` prints the cluster's first authentication key on
    # success. The output format is not documented and has changed between CLI
    # releases, so match both the JSON and the human-readable shapes and treat
    # "no match" as a recoverable condition rather than an error.
    #
    # regex_findall returns capture groups as a list, which sidesteps
    # backreference escaping entirely. An empty list is a clean "not found".
    #
    # Note the deliberate absence of an intermediate `_out: "{{ ...stdout }}"`
    # var. Ansible runs literal_eval over a template's result, so putting JSON
    # output through a var of its own silently turns the string into a dict —
    # after which the patterns below are matching against a Python repr with
    # single quotes and never fire. Filtering stdout directly keeps it a string.
    - name: Extract the cluster key pair from the CLI output
      vars:
        _access: >-
          {{ cluster_create.stdout | default('')
             | regex_findall('pk-[0-9a-zA-Z]{8,}') }}
        # The quote in the separator class is what makes one pattern cover both
        # `"secretKey":"..."` and `secret key: ...`.
        #
        # Single backslash before the s, not double. This is a folded block
        # scalar, where YAML does no escape processing at all — `\\s` would
        # reach the regex engine as an escaped backslash plus a literal `s`,
        # putting `s` in the separator class instead of whitespace. Under
        # ignorecase that silently eats the first character of the secret.
        _secret: >-
          {{ cluster_create.stdout | default('')
             | regex_findall('secret[-_ ]?key["\s:=]+([A-Za-z0-9+/=_-]{16,})',
                             ignorecase=true) }}
      ansible.builtin.set_fact:
        cluster_access_key: "{{ _access[0] if _access | length > 0 else '' }}"
        cluster_secret_key: "{{ _secret[0] if _secret | length > 0 else '' }}"
      no_log: true
      when: cluster_create is not skipped

    # -- Manual fallback ---------------------------------------------------
    # Reached in two situations, both of which are otherwise dead ends:
    #
    #   * the cluster was created but its key could not be parsed out
    #   * the cluster already exists and no credentials file was ever stored
    #
    # Either way the pair is available in the Admin UI and nowhere else, so ask
    # for it once and persist it. Set sdm_credentials_prompt=false to make this
    # a hard failure instead — required for unattended runs.

    - name: Explain what is needed before prompting
      vars:
        _why: >-
          {%- if cluster_exists | bool -%}
          The cluster "{{ sdm_cluster_name }}" already exists and no
          credentials were ever stored for it.
          {%- else -%}
          The cluster was created but its key pair could not be parsed out of
          the CLI output.
          {%- endif -%}
      ansible.builtin.debug:
        msg:
          - "The cluster key pair could not be obtained automatically."
          - ""
          - "{{ _why }}"
          - ""
          - "Get the pair from: Admin UI > Networking > Proxy Clusters >"
          - "\"{{ sdm_cluster_name }}\" > Keys > Add authentication key"
          - ""
          - "Paste it at the prompts below. It will be encrypted to"
          - "credentials/{{ sdm_cluster_name }}.yml and reused on every future run."
      when:
        - cluster_access_key | length == 0 or cluster_secret_key | length == 0
        - sdm_credentials_prompt | bool

    - name: Prompt for the cluster access key
      ansible.builtin.pause:
        prompt: "Cluster access key (pk-...)"
      register: access_key_prompt
      when:
        - cluster_access_key | length == 0 or cluster_secret_key | length == 0
        - sdm_credentials_prompt | bool

    - name: Prompt for the cluster secret key
      ansible.builtin.pause:
        prompt: "Cluster secret key (input hidden)"
        echo: false
      register: secret_key_prompt
      when:
        - cluster_access_key | length == 0 or cluster_secret_key | length == 0
        - sdm_credentials_prompt | bool

    - name: Take the prompted credentials
      ansible.builtin.set_fact:
        cluster_access_key: "{{ access_key_prompt.user_input | trim }}"
        cluster_secret_key: "{{ secret_key_prompt.user_input | trim }}"
        credentials_already_stored: false
      no_log: true
      when: access_key_prompt is not skipped

    - name: Fail with guidance if no key pair could be obtained
      ansible.builtin.fail:
        msg: |
          No proxy cluster authentication key pair is available for
          "{{ sdm_cluster_name }}", and prompting is disabled
          (sdm_credentials_prompt=false).

          {% if cluster_exists | bool %}
          The cluster already exists, so this run did not create one — and
          there is no CLI command to read back or mint a key for an existing
          cluster.
          {% else %}
          The cluster may still have been created; the key pair just could not
          be parsed out of the CLI output.
          {% endif %}

          Finish manually:

            1. Admin UI > Networking > Proxy Clusters
            2. Open "{{ sdm_cluster_name }}" > Keys > Add authentication key
            3. Put the pair into vault.yml as:
                 sdm_proxy_cluster_access_key: "pk-..."
                 sdm_proxy_cluster_secret_key: "..."
            4. Re-run. Cluster creation is skipped and the pair is stored to
               credentials/{{ sdm_cluster_name }}.yml for future runs.

          See README "Bring your own cluster".
      when: cluster_access_key | length == 0 or cluster_secret_key | length == 0

    # -- Validate ----------------------------------------------------------
    # Whatever the source — CLI parse, prompt, stored file, or vault.yml — the
    # pair has to be structurally sound before it is stored or shipped to a
    # worker. "Non-empty" was the only check here previously, and non-empty is
    # not the same as usable: a malformed secret passes it, gets encrypted and
    # stored as though it were good, and then every worker fails to
    # authenticate. The symptom appears two plays later as a bind timeout, which
    # points at the network rather than at the key.
    #
    # A StrongDM cluster secret is standard base64 — so any `=` can only be
    # trailing padding, and the length must be a multiple of four. Both
    # conditions catch the spliced-secret corruption this playbook used to cause
    # (`<secret><partial><secret>` has `=` mid-string and a length of 142).
    - name: Assert that the cluster credentials are well-formed
      ansible.builtin.assert:
        that:
          - cluster_access_key is match('^pk-[0-9a-zA-Z]{8,}$')
          - cluster_secret_key is match('^[A-Za-z0-9+/]{16,}={0,2}$')
          - cluster_secret_key | length % 4 == 0
        fail_msg: >-
          The cluster credentials are malformed. The access key must look like
          `pk-` followed by at least 8 alphanumerics; the secret must be valid
          standard base64, meaning padding only at the end and a length that is
          a multiple of four (got {{ cluster_secret_key | length }} characters).

          If they came from vault.yml or a prompt, re-copy them from the Admin
          UI under Networking > Proxy Clusters > "{{ sdm_cluster_name }}" >
          Keys — a truncated paste is the usual cause.

          If this run created the cluster, the CLI output format has changed and
          the parse picked up the wrong field. Set
          sdm_credentials_prompt: true and paste the pair by hand; it will be
          stored and reused from then on.
        quiet: true

    # -- Persist -----------------------------------------------------------
    # Written the instant the pair is known, before any instance is launched.
    # If a later step blows up, the credentials survive and the next run is a
    # resume rather than a restart.

    - name: Create the credentials directory
      ansible.builtin.file:
        path: "{{ sdm_credentials_dir }}"
        state: directory
        mode: "0700"
      when: not credentials_already_stored | bool

    - name: Write the cluster credentials
      ansible.builtin.copy:
        dest: "{{ sdm_credentials_file }}"
        mode: "0600"
        content: |
          ---
          # StrongDM proxy cluster credentials — {{ sdm_cluster_name }}
          #
          # Written by site.yml on {{ ansible_date_time.iso8601 }} and encrypted
          # with ansible-vault. Every worker in this cluster authenticates with
          # this pair, and StrongDM will not show it again — so this file is the
          # only copy. Back it up somewhere your team can reach.
          #
          # Read back automatically on the next run; nothing to do by hand.
          sdm_cluster_name: {{ sdm_cluster_name }}
          sdm_cluster_address: {{ cluster_address }}
          sdm_cluster_access_key: "{{ cluster_access_key }}"
          sdm_cluster_secret_key: "{{ cluster_secret_key }}"
      no_log: true
      when: not credentials_already_stored | bool

    # copy writes plaintext, so encrypt in place immediately after. The
    # password file is passed explicitly rather than left to ansible.cfg, so
    # this works regardless of the directory the playbook was invoked from.
    - name: Encrypt the credentials file
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt
          - --vault-password-file
          - "{{ sdm_vault_password_file | expanduser }}"
          - "{{ sdm_credentials_file }}"
      changed_when: true
      when: not credentials_already_stored | bool

    - name: Confirm the credentials are stored
      ansible.builtin.debug:
        msg: >-
          Cluster credentials encrypted to
          credentials/{{ sdm_cluster_name }}.yml. Keep it — adding a worker
          later depends on it, and StrongDM cannot reissue this key pair.
      when: not credentials_already_stored | bool

    # Guards against the specific failure of pointing a rebuilt load balancer
    # at an existing cluster: the address changed, the cluster's did not, and
    # every client would be dialling an address that no longer exists.
    - name: Warn if the stored address no longer matches the load balancer
      ansible.builtin.debug:
        msg: >-
          The cluster was created for "{{ stored_cluster.sdm_cluster_address }}"
          but this run resolved "{{ cluster_address }}". A proxy cluster's
          address cannot be changed, so clients will still be sent to the old
          one. This usually means the load balancer was destroyed and rebuilt —
          see README "Rebuilding in nlb mode".
      when:
        - credentials_already_stored | bool
        - stored_cluster.sdm_cluster_address | default('') | length > 0
        - stored_cluster.sdm_cluster_address != cluster_address

    # =====================================================================
    # Instances
    # =====================================================================

    # -- AMI ---------------------------------------------------------------
    # Resolved at runtime rather than hardcoded, so the playbook keeps working
    # as Amazon Linux 2023 gets rebuilt.

    - name: Find the newest Amazon Linux 2023 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - amazon
        filters:
          name: "al2023-ami-2023.*-kernel-6.1-x86_64"
          state: available
          architecture: x86_64
          root-device-type: ebs
          virtualization-type: hvm
      register: al2023_amis

    - name: Select the most recent AMI
      ansible.builtin.set_fact:
        worker_ami_id: >-
          {{ (al2023_amis.images | sort(attribute='creation_date') | last).image_id }}

    - name: Report the selected AMI
      ansible.builtin.debug:
        msg: >-
          Using AMI {{ worker_ami_id }}
          ({{ (al2023_amis.images | sort(attribute='creation_date') | last).name }})

    # ec2_instance matches on the Name tag, so this loop is add-only for free:
    # a worker that already exists comes back unchanged, a new entry in
    # workers.yml gets launched. Note that instance_type and volume size are
    # only honoured at creation — resizing an existing worker is not something
    # this playbook attempts.

    - name: Launch the proxy worker instances
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        name: "{{ item.name }}"
        instance_type: "{{ item.instance_type }}"
        image_id: "{{ worker_ami_id }}"
        key_name: "{{ ssh_key_name }}"
        vpc_subnet_id: "{{ item.subnet_id }}"
        security_groups:
          - "{{ worker_sg.group_id }}"
        volumes:
          - device_name: /dev/xvda
            ebs:
              volume_size: "{{ item.root_volume_gb }}"
              volume_type: gp3
              delete_on_termination: true
        tags: "{{ resource_tags | combine({'Name': item.name}) }}"
        state: running
        wait: true
        wait_timeout: 600
      loop: "{{ workers_resolved }}"
      loop_control:
        label: "{{ item.name }}"
      register: worker_instances

    # In nlb mode the load balancer fronts the fleet, so these are not the
    # cluster's address any more — they exist to guarantee each worker a stable
    # route out to app.strongdm.com and downloads.strongdm.com, and a stable
    # address for Ansible. Set worker_assign_eip: false if the subnets already
    # provide egress.
    - name: Allocate and associate an Elastic IP per worker
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        device_id: "{{ (item.instances | first).instance_id }}"
        in_vpc: true
        release_on_disassociation: false
        tags: "{{ resource_tags | combine({'Name': item.item.name}) }}"
        state: present
      loop: "{{ worker_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: worker_eips
      when: worker_assign_eip | bool

    # One list of dicts describing the built fleet, assembled from the loops
    # above. Everything downstream — inventory, target registration, the
    # summary — reads from this instead of re-indexing loop results.
    #
    # public_ip falls back to whatever the instance was auto-assigned when EIPs
    # are switched off, and to an empty string when it has none at all.
    - name: Build the worker registry
      ansible.builtin.set_fact:
        worker_registry: >-
          {{ worker_registry | default([]) + [{
               'name': item.item.name,
               'instance_id': (item.instances | first).instance_id,
               'private_ip': (item.instances | first).private_ip_address,
               'public_ip': _public_ip,
               'availability_zone': (item.instances | first).placement.availability_zone
             }] }}
      vars:
        _idx: "{{ worker_registry | default([]) | length }}"
        # `default('', true)` and not `default('')`: an instance with no public
        # address returns the key as null rather than omitting it, and plain
        # default() only substitutes for undefined.
        _public_ip: >-
          {{ (worker_eips.results[_idx | int].public_ip)
             if worker_assign_eip | bool
             else ((item.instances | first).public_ip_address | default('', true)) }}
      loop: "{{ worker_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Wait for SSH to accept connections on every worker
      ansible.builtin.wait_for:
        host: "{{ item.private_ip }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
      loop: "{{ worker_registry }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add the workers to the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        # Deliberately NOT sdm_workers. The aws_ec2 dynamic inventory also
        # builds a group from the Project tag, and those hosts carry none of the
        # facts below — so a play targeting it would pick up an inventory-derived
        # host (named by private IP) and fail on undefined vars. This group holds
        # exactly the workers this run provisioned or confirmed.
        groups: sdm_worker_target
        ansible_host: "{{ item.private_ip }}"
        ansible_user: "{{ remote_user }}"
        ansible_ssh_private_key_file: "{{ ssh_key_path | expanduser }}"
        worker_public_ip: "{{ item.public_ip }}"
        worker_private_ip: "{{ item.private_ip }}"
        worker_instance_id: "{{ item.instance_id }}"
        worker_availability_zone: "{{ item.availability_zone }}"
      loop: "{{ worker_registry }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Summarise the fleet
      ansible.builtin.debug:
        msg: >-
          {{ item.name }} | {{ item.instance_id }} |
          {{ item.availability_zone }} |
          private {{ item.private_ip }} | public {{ item.public_ip | default('none') }}
      loop: "{{ worker_registry }}"
      loop_control:
        label: "{{ item.name }}"


# ===========================================================================

- name: Install the proxy worker on every node
  hosts: sdm_worker_target
  gather_facts: true
  become: true
  vars_files:
    - workers.yml
    - vault.yml

  vars:
    # Resolved once in play 1 and read from there, rather than re-derived per
    # host. Every worker in the cluster shares this one pair.
    worker_access_key: "{{ hostvars['localhost'].cluster_access_key | default('') }}"
    worker_secret_key: "{{ hostvars['localhost'].cluster_secret_key | default('') }}"

  handlers:
    - name: Restart the StrongDM worker
      ansible.builtin.systemd_service:
        name: "{{ sdm_service_name }}"
        state: restarted

  tasks:

    # Fail fast and legibly if this play was reached without play 1's facts —
    # e.g. by running with `--limit` or targeting the group by hand.
    - name: Assert that the provisioning facts arrived from play 1
      ansible.builtin.assert:
        that:
          - worker_private_ip is defined
          - worker_access_key | default('') | length > 0
          - worker_secret_key | default('') | length > 0
        fail_msg: >-
          Provisioning facts or cluster credentials are missing. This play must
          run as part of site.yml, which sets them in play 1. Run
          `ansible-playbook site.yml` rather than targeting this play directly.
        quiet: true

    # -- Host preparation --------------------------------------------------

    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Install packages the StrongDM installer needs
      ansible.builtin.dnf:
        name:
          - unzip
          - tar
          - policycoreutils-python-utils
        state: present
        update_cache: true

    # StrongDM's docs say to disable SELinux before installing. Amazon Linux
    # 2023 ships it enabled in permissive mode, which is already compatible;
    # this only intervenes if something turned enforcing on.
    - name: Check the current SELinux mode
      ansible.builtin.command: getenforce
      register: selinux_mode
      changed_when: false
      failed_when: false

    - name: Set SELinux to permissive if it is enforcing
      ansible.posix.selinux:
        policy: targeted
        state: permissive
      when: selinux_mode.stdout | default('') | trim == 'Enforcing'

    - name: Create the StrongDM install directory
      ansible.builtin.file:
        path: "{{ sdm_download_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # -- Download and install ----------------------------------------------

    - name: Check whether the worker is already installed
      ansible.builtin.stat:
        path: "{{ sdm_env_file }}"
      register: sdm_installed

    - name: Download the StrongDM CLI archive
      ansible.builtin.get_url:
        url: "https://{{ sdm_app_domain }}/releases/cli/linux"
        dest: "{{ sdm_download_dir }}/sdmcli_linux_amd64.zip"
        mode: "0644"
        owner: root
        group: root
      when: not sdm_installed.stat.exists

    - name: Unpack the sdm binary
      ansible.builtin.unarchive:
        src: "{{ sdm_download_dir }}/sdmcli_linux_amd64.zip"
        dest: "{{ sdm_download_dir }}"
        remote_src: true
        creates: "{{ sdm_download_dir }}/sdm"
        owner: root
        group: root
        mode: "0755"
      when: not sdm_installed.stat.exists

    # The documented install flow is interactive: it prompts for the access key
    # and then the secret key. The SDM_PROXY_CLUSTER_* environment variables are
    # the documented non-interactive path, and they are the ONLY mechanism used
    # here.
    #
    # An earlier version also piped the pair on stdin as
    # `"{{ access }}\n{{ secret }}"`, on the theory that belt and braces beats
    # either alone. It does not. The installer consumed both, and because the
    # secret had no terminating newline the reader hit EOF mid-line and retried,
    # splicing the buffer — writing the secret into
    # /etc/sysconfig/sdm-worker three times over as
    # `<secret><first 30 chars of secret><secret>`. The access key, terminated
    # by its newline, came through clean, which is what made the corruption look
    # like a key-parsing problem rather than an install one.
    #
    # The worker then failed to authenticate and never bound its traffic port,
    # surfacing two plays later as a bind timeout that looks like a firewall
    # fault. Hence the explicit verification below: never trust that this file
    # says what it was told to say.
    #
    # Every worker gets the same pair — that is how they join one cluster
    # rather than becoming several. `creates:` makes this idempotent, so a
    # worker added later installs while the existing fleet is a no-op.
    - name: Install the StrongDM proxy worker as a systemd service
      ansible.builtin.command:
        cmd: >-
          {{ sdm_download_dir }}/sdm install --worker
          --worker-bind-addr :{{ sdm_worker_bind_port }}
          --app-domain {{ sdm_app_domain }}
        chdir: "{{ sdm_download_dir }}"
        creates: "{{ sdm_env_file }}"
      environment:
        SDM_PROXY_CLUSTER_ACCESS_KEY: "{{ worker_access_key }}"
        SDM_PROXY_CLUSTER_SECRET_KEY: "{{ worker_secret_key }}"
        SDM_APP_DOMAIN: "{{ sdm_app_domain }}"
      register: sdm_install
      no_log: true

    # -- Post-install configuration ----------------------------------------
    # The installer writes /etc/sysconfig/sdm-worker itself, so extra settings
    # are layered in with lineinfile rather than templating the whole file and
    # clobbering what the installer put there.

    - name: Ensure the required settings are in the environment file
      ansible.builtin.lineinfile:
        path: "{{ sdm_env_file }}"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        owner: root
        group: root
        mode: "0600"
        create: true
      loop:
        - { key: SDM_PROXY_CLUSTER_ACCESS_KEY, value: "{{ worker_access_key }}" }
        - { key: SDM_PROXY_CLUSTER_SECRET_KEY, value: "{{ worker_secret_key }}" }
        - { key: SDM_APP_DOMAIN, value: "{{ sdm_app_domain }}" }
        # Enables the liveness endpoint the load balancer health-checks, and
        # with it the coordinated rolling restart during maintenance windows.
        # Without this the workers upgrade independently and the load balancer
        # has no way to know one is going away.
        - { key: SDM_ORCHESTRATOR_PROBES, value: ":{{ sdm_liveness_port }}" }
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      notify: Restart the StrongDM worker

    - name: Apply optional environment settings
      ansible.builtin.lineinfile:
        path: "{{ sdm_env_file }}"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { key: HTTP_PROXY, value: "{{ sdm_http_proxy }}" }
        - { key: HTTPS_PROXY, value: "{{ sdm_https_proxy }}" }
        - { key: NO_PROXY, value: "{{ sdm_no_proxy }}" }
        - { key: SDM_DISABLE_UPDATE, value: "{{ sdm_disable_update | lower }}" }
      loop_control:
        label: "{{ item.key }}"
      when: item.value | string | length > 0
      notify: Restart the StrongDM worker

    # Validated on the worker rather than by comparing values through Ansible,
    # so the secret never reaches a command line or a log. `base64 -d` is the
    # exact check the worker itself performs: the tripled secret this playbook
    # used to produce fails here with "invalid input", where the worker reported
    # it as `illegal base64 data at input byte 56` from inside a restart loop.
    #
    # Catches corruption from any source — the installer, a hand-edit, a
    # half-finished previous run — before the service is asked to start.
    - name: Verify the credentials in the environment file are well-formed
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          n=$(grep -c '^SDM_PROXY_CLUSTER_SECRET_KEY=' {{ sdm_env_file }})
          [ "$n" -eq 1 ] || { echo "expected 1 secret key line, found $n" >&2; exit 1; }
          v=$(grep -m1 '^SDM_PROXY_CLUSTER_SECRET_KEY=' {{ sdm_env_file }} | cut -d= -f2-)
          printf '%s' "$v" | base64 -d > /dev/null \
            || { echo "secret key is not valid base64 (length ${#v})" >&2; exit 1; }
          grep -qE '^SDM_PROXY_CLUSTER_ACCESS_KEY=pk-[0-9a-zA-Z]{8,}$' {{ sdm_env_file }} \
            || { echo "access key line is missing or malformed" >&2; exit 1; }
        executable: /bin/bash
      changed_when: false

    - name: Flush handlers so the service picks up configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure the worker service is enabled and running
      ansible.builtin.systemd_service:
        name: "{{ sdm_service_name }}"
        state: started
        enabled: true
        daemon_reload: true
      register: sdm_service

    # -- Verification ------------------------------------------------------

    - name: Wait for the worker to bind its client port
      ansible.builtin.wait_for:
        port: "{{ sdm_worker_bind_port }}"
        host: 0.0.0.0
        timeout: 120
        state: started

    # A healthy proxy worker answers HTTPS with 404 — it is a TLS proxy, not a
    # web server, so 404 is the documented success signal.
    - name: Confirm the worker answers with HTTP 404
      ansible.builtin.uri:
        url: "https://{{ worker_private_ip }}:{{ sdm_worker_bind_port }}"
        validate_certs: false
        status_code:
          - 404
        timeout: 30
      register: worker_probe
      retries: 6
      delay: 10
      until: worker_probe is succeeded

    # Checked here, on the worker itself, before the load balancer is asked to
    # depend on it. A target group whose health check never passes is a slow
    # and confusing failure; a 200 from this endpoint is a fast and clear one.
    - name: Confirm the liveness endpoint answers with HTTP 200
      ansible.builtin.uri:
        url: "http://{{ worker_private_ip }}:{{ sdm_liveness_port }}{{ sdm_liveness_path }}"
        status_code:
          - 200
        timeout: 30
      register: liveness_probe
      retries: 6
      delay: 10
      until: liveness_probe is succeeded

    - name: Report this worker
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ worker_availability_zone }}):
          {{ sdm_service_name }}
          {{ sdm_service.status.ActiveState | default('unknown') }},
          traffic HTTP {{ worker_probe.status }} (404 = healthy),
          liveness HTTP {{ liveness_probe.status }}


# ===========================================================================

- name: Put the workers into rotation and report
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - workers.yml

  tasks:

    # Registered after the install, not before, so the target group never holds
    # a worker that cannot answer a health check. state: present with no purge
    # keeps this add-only: an existing target is left alone.
    - name: Register the workers with the load balancer
      community.aws.elb_target:
        region: "{{ aws_region }}"
        target_group_name: "{{ nlb_target_group_name }}"
        target_id: "{{ item.instance_id }}"
        target_port: "{{ sdm_worker_bind_port }}"
        state: present
        # Waits for the liveness health check to pass, which is the real
        # end-to-end proof: the worker is up, the security group allows the
        # health check through, and the load balancer will send it traffic.
        target_status: healthy
        target_status_timeout: 300
      loop: "{{ worker_registry }}"
      loop_control:
        label: "{{ item.name }}"
      when: sdm_cluster_endpoint == 'nlb'

    - name: Report the finished cluster
      ansible.builtin.debug:
        msg:
          - "Cluster:  {{ sdm_cluster_name }}"
          - "Address:  {{ cluster_address }}"
          - "Workers:  {{ worker_registry | length }} in {{ worker_registry | map(attribute='availability_zone') | unique | sort | join(', ') }}"
          - ""
          - "Attach resources to the cluster in the Admin UI under Networking >"
          - "Proxy Clusters, or with --proxy-cluster-id at the CLI. Resources"
          - "attach to the cluster, not to a worker, so this is a one-time step."
          - ""
          - "Adding a worker later: append it to sdm_workers in workers.yml and"
          - "re-run. The stored credentials in credentials/{{ sdm_cluster_name }}.yml"
          - "are what let it join this cluster instead of forming a new one."

    - name: Explain the remaining manual step in manual mode
      ansible.builtin.debug:
        msg:
          - "sdm_cluster_endpoint is \"manual\", so no load balancer was created."
          - ""
          - "Point {{ sdm_cluster_hostname }} at your load balancer, and register"
          - "these workers as its backends on port {{ sdm_worker_bind_port }}:"
          - "{{ worker_registry | map(attribute='public_ip') | list }}"
          - ""
          - "Health check {{ sdm_liveness_path }} on port {{ sdm_liveness_port }}"
          - "expecting HTTP 200 — NOT the traffic port. A worker draining for a"
          - "rolling upgrade keeps serving traffic but shuts the liveness port"
          - "down, which is how it asks to be taken out of rotation."
          - ""
          - "Use a layer-4 / TCP passthrough listener. The workers terminate"
          - "mutual TLS themselves, so anything that terminates TLS for them"
          - "will break the handshake."
      when: sdm_cluster_endpoint == 'manual'
