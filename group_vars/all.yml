---
# ============================================================================
# Non-secret configuration.
#
#   workers.yml         cluster name, cluster DNS name, and the worker list
#   group_vars/all.yml  everything else (this file)
#   vault.yml           secrets (see vault.yml.example)
#
# Cluster topology lives in workers.yml deliberately: that is the one file you
# edit to grow the fleet, so it is worth keeping small.
# ============================================================================

# ---------------------------------------------------------------------------
# AWS
# ---------------------------------------------------------------------------
aws_region: us-east-2

# Leave vpc_id / subnet_id empty to use the account's default VPC and its
# default-for-AZ subnets. Set them explicitly for a non-default VPC.
#
# subnet_id here is a global override that pins EVERY worker to one subnet.
# Leave it empty to let the playbook spread workers across the available
# subnets — which is the point of running more than one worker. Individual
# workers can still pin themselves via `subnet_id` in workers.yml.
vpc_id: ""
subnet_id: ""

# Defaults for any worker in workers.yml that does not override them.
# t3.medium == 2 vCPU / 4 GB is StrongDM's documented minimum for a proxy
# worker. t3.small is fine for a demo; do not ship it to production.
instance_type: t3.small
root_volume_gb: 8

# Tags applied to every AWS resource this playbook creates.
#
# No Name tag here — that is per-worker and set at instance creation. The
# Cluster tag is what lets teardown scope itself to one cluster when several
# share an account.
resource_tags:
  Project: strongdm-ansible-demo
  Cluster: "{{ sdm_cluster_name }}"
  ManagedBy: ansible
  Owner: david.chase@delinea.com
  Environment: sandbox

# One security group shared by every worker in the cluster — they all have the
# same ingress requirements, and a shared group means adding a worker needs no
# firewall change.
worker_sg_name: "{{ sdm_cluster_name }}-sg"

# An Elastic IP per worker. Not needed for the cluster address in nlb mode —
# the load balancer fronts the fleet — but it guarantees each worker a stable
# route out to app.strongdm.com and a stable address for Ansible's SSH.
#
# Set false only if the workers' subnets already give them egress, via
# auto-assign public IP or a NAT gateway. Getting that wrong shows up as the
# install hanging on the StrongDM download rather than as an obvious network
# error, which is why it defaults to true.
worker_assign_eip: true

# ---------------------------------------------------------------------------
# Load balancer (nlb mode only)
# ---------------------------------------------------------------------------
# Names are capped at 32 characters by the ELB API, and the cluster name is
# already user-supplied, so both are truncated rather than left to fail deep
# inside a boto3 call.
nlb_name: "{{ (sdm_cluster_name ~ '-nlb') | truncate(32, true, '') }}"
nlb_target_group_name: "{{ (sdm_cluster_name ~ '-tg') | truncate(32, true, '') }}"

# Cross-zone load balancing is off by default on an NLB, which means traffic is
# split evenly per availability zone rather than per worker. With an uneven
# number of workers per AZ that skews load noticeably. Enabling it costs
# inter-AZ data transfer and is worth it.
nlb_cross_zone: true

# StrongDM's liveness probe, and the correct thing for a load balancer to
# health-check. Enabled by SDM_ORCHESTRATOR_PROBES in the worker's environment
# file; answers HTTP 200 on /liveness when the worker is healthy.
#
# Do NOT health-check the traffic port instead. During a maintenance-window
# rolling upgrade a worker keeps serving traffic but deliberately shuts down
# this port, which is how it tells the load balancer to drain it. A health
# check against 8443 would keep sending new connections to a worker that is
# about to sever them.
sdm_liveness_port: 9090
sdm_liveness_path: /liveness

# Tunable so a fallback to a plain TCP check is a one-line change if the
# liveness probe is ever unavailable.
nlb_health_check_protocol: HTTP
nlb_health_check_codes: "200"
nlb_health_check_interval: 10
nlb_healthy_threshold: 2
nlb_unhealthy_threshold: 2

# ---------------------------------------------------------------------------
# Network access
# ---------------------------------------------------------------------------
# CIDRs allowed to reach the workers on their client-facing port.
# 0.0.0.0/0 is acceptable for a throwaway sandbox because the worker requires
# mutual TLS with a StrongDM-issued client certificate. Narrow it anyway if
# your account has guardrails that object.
client_ingress_cidrs:
  - 0.0.0.0/0

# CIDR allowed to SSH to the workers. Defaults to the control node's own
# private IP, discovered at runtime. Override only if you need to.
ssh_ingress_cidrs: []

# ---------------------------------------------------------------------------
# SSH
# ---------------------------------------------------------------------------
ssh_key_name: sdm-ansible-demo
ssh_key_path: "~/.ssh/{{ ssh_key_name }}"
remote_user: ec2-user

# ---------------------------------------------------------------------------
# StrongDM
# ---------------------------------------------------------------------------
# Control plane region. Use app.uk.strongdm.com or app.eu.strongdm.com if your
# org's control plane lives there. This is the CONTROL PLANE region, not your
# own location. Default for most orgs is US.
sdm_app_domain: app.strongdm.com

# Where the sdm binary and its systemd environment file end up. These paths are
# what StrongDM's installer uses; changing them will break `systemctl`.
sdm_env_file: /etc/sysconfig/sdm-worker
sdm_service_name: sdm-worker
sdm_download_dir: /opt/strongdm

# If your environment egresses through a corporate proxy, set these and they
# will be written into each worker's systemd environment file.
sdm_http_proxy: ""
sdm_https_proxy: ""
sdm_no_proxy: ""

# Set true to pin workers at their installed version instead of letting them
# self-upgrade during the daily maintenance window. Handy if you are demoing
# and do not want a surprise restart.
sdm_disable_update: false

# ---------------------------------------------------------------------------
# Credential persistence
# ---------------------------------------------------------------------------
# A proxy cluster's access key / secret key pair is shown exactly once, when
# the cluster is created. There is no CLI command to read it back or to mint a
# replacement — so if it is lost, the only path to adding a worker is a new
# key from the Admin UI, or a new cluster.
#
# The playbook therefore writes the pair to an ansible-vault encrypted file the
# moment the cluster is created, and reads it back on every subsequent run.
# That file is what makes "add another worker" a one-line change.
#
# Encrypted with the same password ansible.cfg already points at
# (~/.ansible-vault-pass), so there is nothing extra to manage.
sdm_credentials_dir: "{{ playbook_dir }}/credentials"
sdm_credentials_file: "{{ sdm_credentials_dir }}/{{ sdm_cluster_name }}.yml"

# Passed explicitly to `ansible-vault encrypt` rather than relying on the
# ansible.cfg setting, so the encrypt step works no matter where the playbook
# is invoked from. Keep it in step with `vault_password_file` in ansible.cfg.
sdm_vault_password_file: "~/.ansible-vault-pass"

# If the key pair cannot be parsed out of the CLI output — or the cluster
# already exists and no credentials file was ever stored — prompt for the pair
# instead of failing, then encrypt and store it like any other run.
#
# This is the manual escape hatch for the fact that StrongDM will not show a
# cluster's key twice: paste it in once from the Admin UI and every future run
# reads it from the encrypted file. Set false for unattended CI runs, where a
# prompt would hang.
sdm_credentials_prompt: true

# ---------------------------------------------------------------------------
# Escape hatch
# ---------------------------------------------------------------------------
# Set these in vault.yml to supply a key pair you already hold — from the Admin
# UI, or from a cluster this playbook did not create. They take precedence over
# both cluster creation and the stored credentials file.
# See README "Bring your own cluster".
sdm_proxy_cluster_access_key: ""
sdm_proxy_cluster_secret_key: ""
