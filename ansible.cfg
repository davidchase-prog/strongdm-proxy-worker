[defaults]
inventory              = inventory/
host_key_checking      = False
interpreter_python     = auto_silent
retry_files_enabled    = False
nocows                 = True
vault_password_file    = ~/.ansible-vault-pass

# Readable YAML task output, native to ansible-core 2.13+.
# Do NOT use `stdout_callback = yaml` — that callback lives in
# community.general, which this repo deliberately does not depend on.
callback_result_format = yaml

# Per-task timings. FQCN required: profile_tasks ships in ansible.posix,
# which is in requirements.yml.
callbacks_enabled      = ansible.posix.profile_tasks

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
